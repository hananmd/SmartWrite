# Alembic configuration for SmartWrite.
# Run migrations from the PROJECT ROOT so `backend.app` is importable, e.g.:
#   alembic revision --autogenerate -m "message"
#   alembic upgrade head

[alembic]
# Migration scripts live under the backend package.
script_location = backend/alembic

# Use a path-friendly template that includes a date prefix.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# The actual DB URL is injected at runtime in env.py from DATABASE_URL,
# so this placeholder is intentionally left blank.
sqlalchemy.url =

prepend_sys_path = .

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
