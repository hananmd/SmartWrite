<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartWrite</title>
  <link rel="manifest" href="./manifest.json"/>
  <link rel="icon" href="./icon.svg" type="image/svg+xml"/>
  <!-- Apple touch icon for iOS/home screen -->
  <link rel="apple-touch-icon" href="./icon.png"/>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <style>
    body { background: #f8f9fa; }

    /* Loading overlay — shown until JS resolves auth state */
    #loading-overlay {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #fff; z-index: 9999;
    }

    /* Auth view */
    #auth-view {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 1rem;
    }
    .auth-card { width: 100%; max-width: 420px; }

    /* Correction result */
    #corrected-text-box {
      background: #f0f0ff;
      border-radius: 0.5rem;
      padding: 1rem;
      white-space: pre-wrap;
      font-family: inherit;
      line-height: 1.6;
    }
    .result-tone-badge { font-size: 0.72rem; }
    /* larger spinner sizing moved from inline styles */
    .spinner-lg { width: 3rem; height: 3rem; }
    .brand-title { color: #6366f1; }
  </style>
</head>
<body>

<!-- Loading spinner (hidden after auth check) -->
<div id="loading-overlay">
  <div class="text-center">
    <div class="spinner-border text-primary mb-3 spinner-lg"></div>
    <div class="text-muted small">Loading SmartWrite…</div>
  </div>
</div>

<!-- ===== AUTH VIEW ===== -->
<div id="auth-view" class="d-none">
  <div class="auth-card">
    <div class="text-center mb-4">
      <img src="./icon.svg" width="60" height="60" alt="SmartWrite logo"/>
      <h2 class="mt-2 fw-bold" style="color:#6366f1;">SmartWrite</h2>
      <p class="text-muted small mb-0">AI-powered writing assistant</p>
    </div>
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <div class="nav nav-tabs mb-4" role="tablist">
          <div class="nav-item flex-fill text-center">
            <button id="login-tab-btn" class="nav-link active w-100" type="button" role="tab" aria-controls="login-pane" aria-selected="true" data-bs-toggle="tab" data-bs-target="#login-pane">
              Sign In
            </button>
          </div>
          <div class="nav-item flex-fill text-center">
            <button id="register-tab-btn" class="nav-link w-100" type="button" role="tab" aria-controls="register-pane" aria-selected="false" data-bs-toggle="tab" data-bs-target="#register-pane">
              Sign Up
            </button>
          </div>
        </div>

        <div id="auth-error" class="alert alert-danger d-none py-2 small" role="alert"></div>

        <div class="tab-content">
          <!-- Login -->
          <div class="tab-pane fade show active" id="login-pane" role="tabpanel" aria-labelledby="login-tab-btn">
            <form id="login-form" novalidate>
              <div class="mb-3">
                <label for="login-email" class="form-label">Email</label>
                <input id="login-email" type="email" class="form-control"
                       placeholder="you@example.com" autocomplete="email" required/>
              </div>
              <div class="mb-3">
                <label for="login-password" class="form-label">Password</label>
                <input id="login-password" type="password" class="form-control"
                       placeholder="••••••••" autocomplete="current-password" required/>
              </div>
              <button id="login-btn" type="submit" class="btn btn-primary w-100">
                <span id="login-spinner" class="spinner-border spinner-border-sm d-none me-1"></span>
                Sign In
              </button>
            </form>
          </div>

          <!-- Register -->
          <div class="tab-pane fade" id="register-pane" role="tabpanel" aria-labelledby="register-tab-btn">
            <form id="register-form" novalidate>
              <div class="mb-3">
                <label for="reg-email" class="form-label">Email</label>
                <input id="reg-email" type="email" class="form-control"
                       placeholder="you@example.com" autocomplete="email" required/>
              </div>
              <div class="mb-3">
                <label for="reg-password" class="form-label">Password</label>
                <input id="reg-password" type="password" class="form-control"
                       placeholder="At least 8 characters" autocomplete="new-password" required/>
              </div>
              <button id="register-btn" type="submit" class="btn btn-primary w-100">
                <span id="register-spinner" class="spinner-border spinner-border-sm d-none me-1"></span>
                Create Account
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ===== APP VIEW ===== -->
<div id="app-view" class="d-none">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark" style="background:#6366f1;">
    <div class="container-fluid">
      <span class="navbar-brand fw-bold d-flex align-items-center gap-2">
        <img src="./icon.svg" width="28" height="28" alt="SmartWrite logo"/>SmartWrite
      </span>
      <div class="ms-auto d-flex align-items-center gap-3">
        <span class="text-white-50 small d-none d-md-inline" id="user-email"></span>
        <button id="logout-btn" type="button" class="btn btn-outline-light btn-sm">
          <i class="bi bi-box-arrow-right me-1"></i>Sign Out
        </button>
      </div>
    </div>
  </nav>

  <div class="container py-4" style="max-width: 880px;">

    <!-- Main tabs -->
    <div class="nav nav-pills mb-4" id="main-tabs" role="tablist">
      <button id="main-tab-write-btn" class="nav-link active" type="button" role="tab" aria-controls="tab-write" aria-selected="true" data-tab="write">
        <i class="bi bi-pencil-square me-1"></i>Write
      </button>
      <button id="main-tab-history-btn" class="nav-link" type="button" role="tab" aria-controls="tab-history" aria-selected="false" data-tab="history">
        <i class="bi bi-clock-history me-1"></i>History
      </button>
      <button id="main-tab-analytics-btn" class="nav-link" type="button" role="tab" aria-controls="tab-analytics" aria-selected="false" data-tab="analytics">
        <i class="bi bi-bar-chart-line me-1"></i>Analytics
      </button>
    </div>

    <!-- ---- WRITE TAB ---- -->
    <div id="tab-write" role="tabpanel" aria-labelledby="main-tab-write-btn">
      <div class="card shadow-sm">
        <div class="card-body">
          <form id="correct-form">
            <div class="mb-3">
              <label for="input-text" class="form-label fw-semibold">Your Text</label>
              <textarea id="input-text" class="form-control" rows="7"
                placeholder="Paste or type your text here…"
                maxlength="5000" required></textarea>
              <div class="form-text text-end">
                <span id="char-count" aria-live="polite">0</span> / 5000 characters
              </div>
            </div>
            <div class="row g-3 align-items-end">
              <div class="col-sm-6">
                <label for="tone-select" class="form-label fw-semibold">Target Tone</label>
                <select id="tone-select" class="form-select">
                  <option value="">Auto — AI picks best tone</option>
                  <option value="formal">Formal</option>
                  <option value="casual">Casual</option>
                  <option value="friendly">Friendly</option>
                  <option value="professional">Professional</option>
                </select>
              </div>
              <div class="col-sm-6">
                <button id="correct-btn" type="submit" class="btn btn-primary w-100">
                  <span id="correct-spinner" class="spinner-border spinner-border-sm d-none me-1"></span>
                  <i class="bi bi-magic me-1"></i>Correct Text
                </button>
              </div>
            </div>
          </form>

          <!-- Correction error -->
          <div id="correct-error" class="alert alert-danger mt-3 d-none py-2 small" role="alert"></div>

          <!-- Result card -->
          <div id="result-card" class="mt-4 d-none">
            <hr/>
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-2 gap-2">
              <h6 class="mb-0 fw-semibold">Corrected Text</h6>
              <div class="d-flex gap-2">
                <span id="result-detected" class="badge bg-secondary result-tone-badge">detected: —</span>
                <span id="result-applied"  class="badge result-tone-badge"
                      style="background:#6366f1;">applied: —</span>
              </div>
            </div>
            <div id="corrected-text-box"></div>
            <div class="d-flex justify-content-between align-items-start mt-3 gap-2">
              <small class="text-muted" id="result-summary"></small>
              <button id="copy-btn" type="button" class="btn btn-sm btn-outline-secondary flex-shrink-0">
                <i class="bi bi-clipboard me-1"></i>Copy
              </button>
            </div>
            <div id="result-warning" class="alert alert-warning mt-2 py-2 small d-none"></div>
          </div>
        </div>
      </div>
    </div><!-- /tab-write -->

    <!-- ---- HISTORY TAB ---- -->
    <div id="tab-history" class="d-none" role="tabpanel" aria-labelledby="main-tab-history-btn">
      <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span class="fw-semibold">Correction History</span>
          <button id="refresh-history-btn" type="button" class="btn btn-sm btn-outline-secondary" title="Refresh">
            <i class="bi bi-arrow-clockwise"></i>
          </button>
        </div>
        <div id="history-list" class="list-group list-group-flush"></div>
        <div id="history-empty" class="card-body text-muted text-center d-none">
          <i class="bi bi-journal-x fs-2 d-block mb-2"></i>
          No corrections yet. Use the <strong>Write</strong> tab to get started.
        </div>
        <div id="load-more-footer" class="card-footer text-center d-none">
          <button id="load-more-btn" type="button" class="btn btn-sm btn-outline-primary">Load more</button>
        </div>
      </div>
    </div><!-- /tab-history -->

    <!-- ---- ANALYTICS TAB ---- -->
    <div id="tab-analytics" class="d-none" role="tabpanel" aria-labelledby="main-tab-analytics-btn">
      <!-- Stat cards -->
      <div class="row g-3 mb-4">
        <div class="col-sm-4">
          <div class="card text-center shadow-sm h-100">
            <div class="card-body py-4">
              <div class="fs-1 fw-bold text-primary" id="stat-total">—</div>
              <div class="text-muted small mt-1">Total Corrections</div>
            </div>
          </div>
        </div>
        <div class="col-sm-4">
          <div class="card text-center shadow-sm h-100">
            <div class="card-body py-4">
              <div class="fs-1 fw-bold text-success" id="stat-7d">—</div>
              <div class="text-muted small mt-1">Last 7 Days</div>
            </div>
          </div>
        </div>
        <div class="col-sm-4">
          <div class="card text-center shadow-sm h-100">
            <div class="card-body py-4">
              <div class="fs-3 fw-bold text-capitalize" id="stat-top-tone"
                   style="color:#6366f1;">—</div>
              <div class="text-muted small mt-1">Most Used Tone</div>
            </div>
          </div>
        </div>
      </div>
      <!-- Tone breakdown -->
      <div class="card shadow-sm">
        <div class="card-header fw-semibold">Corrections by Tone</div>
        <div class="card-body" id="tone-breakdown">
          <div class="text-center py-3">
            <div class="spinner-border text-primary spinner-border-sm"></div>
          </div>
        </div>
      </div>
    </div><!-- /tab-analytics -->

  </div><!-- /container -->
</div><!-- /app-view -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="./app.js" defer></script>
</body>
</html>
