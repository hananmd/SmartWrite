<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        body {
            background: radial-gradient(circle at top left, #1A0A2E 0%, #0D0D1A 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 40px rgba(124, 58, 237, 0.1);
        }

        .shimmer-btn {
            position: relative;
            overflow: hidden;
            background: linear-gradient(90deg, #7c3aed, #03b5d3);
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .shimmer-btn:after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                to right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.3) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(30deg);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-150%) rotate(30deg); }
            100% { transform: translateX(150%) rotate(30deg); }
        }

        .floating-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        input:focus {
            box-shadow: 0 0 15px rgba(124, 58, 237, 0.4);
            border-color: #4cd7f6 !important;
        }

        .tab-active {
            color: #d2bbff;
            border-bottom: 2px solid #7c3aed;
        }
    </style>
</head>
<body class="antialiased selection:bg-primary/30">
<!-- Atmospheric Background Animation -->
<div class="floating-particles">
<canvas id="particleCanvas"></canvas>
</div>
<!-- Main Auth Container -->
<main class="w-full max-w-md px-6 py-12 relative z-10">
<!-- Logo Section -->
<div class="flex flex-col items-center mb-10">
<div class="w-24 h-24 mb-4 relative">
<img alt="SmartWrite Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB51X5UNLWJAtwlASxFxUsoD6KWUEYT09N3qK00iT5sK3cCUXx4vpvf6LY6ciWL98_yqAaftTfIh_FXVKMcE2xmY8Deybr5VdjxHhWIQIEfSTHDYTJeUPoiN8aqCtSYeDXkpcYi1Dq6B8VNswCuUC5B0wRbzqui-SPi75IOgFWKo_o_iLtWWDl3KY7KwuXBb8iJjKnJxRpIpuuLFw5bRSWhf7i7BJKTgeaiVqi_3JE9qj_-Zj8VLrtdR30Mab5WZLNamXCIwt9Je3Ry"/>
<div class="absolute inset-0 bg-primary/20 blur-2xl rounded-full -z-10 animate-pulse"></div>
</div>
<h1 class="font-display-lg text-display-lg-mobile md:text-display-lg text-primary tracking-tight">SmartWrite</h1>
<p class="font-body-md text-body-md text-text-muted mt-2">Next-gen AI Writing Suite</p>
</div>
<!-- Auth Card -->
<div class="glass-card rounded-xl p-8 transition-all duration-500 hover:shadow-[0_0_50px_rgba(124,58,237,0.15)]">
<!-- Tab Switcher -->
<div class="flex border-b border-glass-stroke mb-8">
<button class="flex-1 py-3 font-label-sm text-label-sm text-primary border-b-2 border-primary transition-all duration-300" id="tab-signin" onclick="switchTab('signin')">
                    SIGN IN
                </button>
<button class="flex-1 py-3 font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface transition-all duration-300" id="tab-signup" onclick="switchTab('signup')">
                    SIGN UP
                </button>
</div>
<!-- Form Content -->
<form class="space-y-6" id="authForm" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label-sm text-label-sm text-text-muted uppercase tracking-widest ml-1" for="email">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-lg transition-colors group-focus-within:text-secondary">
                            mail
                        </span>
<input class="w-full bg-glass-fill border border-glass-stroke rounded-lg py-3.5 pl-12 pr-4 text-on-surface font-body-md outline-none transition-all duration-300 hover:bg-white/10 focus:bg-white/10 placeholder:text-outline/50" id="email" placeholder="commander@smartwrite.ai" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">

</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-lg transition-colors group-focus-within:text-secondary">
                            lock
                        </span>
<input class="w-full bg-glass-fill border border-glass-stroke rounded-lg py-3.5 pl-12 pr-4 text-on-surface font-body-md outline-none transition-all duration-300 hover:bg-white/10 focus:bg-white/10 placeholder:text-outline/50" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button" onclick="togglePassword()">
<span class="material-symbols-outlined text-lg" id="visibility-icon">visibility</span>
</button>
</div>
</div>
<!-- Confirm Password Field (sign-up only) -->
<div class="space-y-2 hidden" id="confirm-password-field">
<div class="flex items-center px-1">
<label class="font-label-sm text-label-sm text-text-muted uppercase tracking-widest" for="confirm-password">Confirm Password</label>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-lg transition-colors group-focus-within:text-secondary">
                            lock
                        </span>

<div class="pt-4">

</div>
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 bg-glass-fill border border-glass-stroke py-3 rounded-lg hover:bg-white/10 transition-all group">
<span class="material-symbols-outlined text-xl group-hover:text-primary transition-colors" data-icon="cloud">cloud</span>
<span class="font-label-sm text-label-sm">Google</span>
</button>
<button class="flex items-center justify-center gap-3 bg-glass-fill border border-glass-stroke py-3 rounded-lg hover:bg-white/10 transition-all group">
<span class="material-symbols-outlined text-xl group-hover:text-primary transition-colors" data-icon="terminal">terminal</span>
<span class="font-label-sm text-label-sm">GitHub</span>
</button>
</div>
</div>
</form>
</div>
<!-- Footer Help -->
<footer class="mt-8 text-center space-y-2">
<p class="font-label-xs text-label-xs text-text-muted uppercase tracking-tighter">
                Secured by SmartWrite Quantum-Grade Encryption
            </p>
<div class="flex justify-center gap-6 text-outline font-label-xs text-label-xs">
<a class="hover:text-secondary transition-colors" href="#">Privacy Policy</a>
<a class="hover:text-secondary transition-colors" href="#">Terms of Service</a>
<a class="hover:text-secondary transition-colors" href="#">Contact Intelligence</a>
</div>

</main>
<script>
        // Simple tab switching logic
        function switchTab(type) {
            const signinTab = document.getElementById('tab-signin');
            const signupTab = document.getElementById('tab-signup');
            const btn = document.querySelector('.shimmer-btn');
            const forgotLink = document.getElementById('forgot-link');
            const confirmField = document.getElementById('confirm-password-field');

            if (type === 'signin') {
                signinTab.className = 'flex-1 py-3 font-label-sm text-label-sm text-primary border-b-2 border-primary transition-all duration-300';
                signupTab.className = 'flex-1 py-3 font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface transition-all duration-300';
                btn.textContent = 'Sign In';
                forgotLink.classList.remove('hidden');
                confirmField.classList.add('hidden');
            } else {
                signupTab.className = 'flex-1 py-3 font-label-sm text-label-sm text-primary border-b-2 border-primary transition-all duration-300';
                signinTab.className = 'flex-1 py-3 font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface transition-all duration-300';
                btn.textContent = 'Create Account';
                forgotLink.classList.add('hidden');
                confirmField.classList.remove('hidden');
            }
        }

        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('visibility-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        // Particle background animation
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function initParticles() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < 50; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 1,
                    speedX: (Math.random() - 0.5) * 0.5,
                    speedY: (Math.random() - 0.5) * 0.5,
                    opacity: Math.random() * 0.5
                });
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.speedX;
                p.y += p.speedY;
                if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
                if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;
                
                ctx.fillStyle = `rgba(124, 58, 237, ${p.opacity})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', initParticles);
        initParticles();
        animate();

        // Material Icons weight setup
        document.querySelectorAll('.material-symbols-outlined').forEach(span => {
            if (span.getAttribute('data-weight') === 'fill') {
                span.style.fontVariationSettings = "'FILL' 1";
            }
        });
    </script>
